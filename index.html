
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GI Weather</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="weather-app">
            <h1>GI Weather</h1>

                <!-- Weather information will be displayed here -->
            </div>
            <!-- Container for weather GIF -->
            <div id="weatherGif"></div>
        </div>
        <footer>
            <div class="container">
                <div class="copyright">
                  &copy; <script>document.write(new Date().getFullYear());</script>
                  <strong class="px-1 sitename">GI Weather</strong>

                </div>
            </div>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
